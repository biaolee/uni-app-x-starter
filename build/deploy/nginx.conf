# ============================================================================
# uni-app x H5 生产部署 nginx 配置模板
# 用法：容器内放置于 /etc/nginx/conf.d/default.conf（见 build/deploy/Dockerfile）；
#       物理机部署复制到 nginx 配置目录后按需修改 server_name 与后端地址。
# ============================================================================
server {
    listen       80;
    server_name  _;

    # H5 构建产物目录（pnpm build:h5 输出 dist/build/h5）
    root   /usr/share/nginx/html;
    index  index.html;

    # 上传体积上限（按业务调整；大文件上传还需配合后端限制）
    client_max_body_size 20m;

    # gzip 压缩
    gzip               on;
    gzip_comp_level    6;
    gzip_min_length    1k;
    gzip_types         text/plain text/css application/json application/javascript
                       application/x-javascript text/xml application/xml image/svg+xml
                       application/font-ttf font/ttf font/otf;
    gzip_vary          on;

    # 带哈希的静态资源：永久强缓存
    location ~* ^/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # 入口 HTML：不缓存，保证发版即时生效
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # 后端接口反向代理（与 VITE_ 前缀 /api 对应；按实际后端地址修改）
    # 若前端直连后端（不经过本 nginx），可整段删除并在 env 中配置完整域名。
    location /api/ {
        proxy_pass         http://backend:8080/;   # 末尾 / 会剥掉 /api 前缀，不需要剥离则去掉
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 单页路由回退（hash 路由同样兼容；history 路由必须）
    location / {
        try_files $uri $uri/ /index.html;
    }
}
