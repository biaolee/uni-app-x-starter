# pnpm 10+ 工作区配置（本项目非 monorepo，此文件仅用于承载全局设置与版本 overrides）

# 允许执行构建脚本的依赖（esbuild 为 vite 必需；hbuilderx-cli 用于 App 端 uni-launch）
allowBuilds:
  '@dcloudio/hbuilderx-cli': true
  '@parcel/watcher': true
  core-js: true
  core-js-pure: true
  esbuild: true

minimumReleaseAgeExclude:
  - sass@1.105.1

# 锁定 @vue 全家桶版本，与 uni-app x 蒸汽编译器保持一致，避免子依赖漂移
overrides:
  '@vue/compiler-core': 3.5.13
  '@vue/compiler-dom': 3.5.13
  '@vue/compiler-sfc': 3.5.13
  '@vue/compiler-ssr': 3.5.13
  '@vue/reactivity': 3.5.13
  '@vue/runtime-core': 3.5.13
  '@vue/runtime-dom': 3.5.13
  '@vue/server-renderer': 3.5.13
  '@vue/shared': 3.5.13

  jpeg-js: 0.4.4
  path-to-regexp@0.1.10: 0.1.13
patchedDependencies:
  '@dcloudio/uni-cli-shared@3.0.0-5020620260917001': build/patches/@dcloudio__uni-cli-shared@3.0.0-5020620260917001.patch
  '@dcloudio/uni-h5-vue@3.0.0-5020620260917001': build/patches/@dcloudio__uni-h5-vue@3.0.0-5020620260917001.patch
  '@dcloudio/uni-uts-v1@3.0.0-5020620260917001': build/patches/@dcloudio__uni-uts-v1@3.0.0-5020620260917001.patch
  '@uni-helper/vite-plugin-uni-pages@0.5.0': build/patches/@uni-helper__vite-plugin-uni-pages@0.5.0.patch
